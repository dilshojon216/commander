<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Commander mobil · Sessiyalar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.t-dark{--bg:#0B0D10;--s1:#12151A;--s2:#181C22;--s3:#20252D;--bd:#262C35;--tx:#E6E8EB;--mu:#9AA3B0;--fa:#6E7684;--blue:#5B9BFF;--yel:#E8BE54;--org:#FF8A4C;--grn:#4CC38A;--red:#FF6B66;--blueBg:rgba(91,155,255,.13);--yelBg:rgba(232,190,84,.13);--orgBg:rgba(255,138,76,.14);--grnBg:rgba(76,195,138,.13);--grayBg:rgba(154,163,176,.12)}
.t-light{--bg:#F4F5F7;--s1:#FFFFFF;--s2:#F7F8FA;--s3:#ECEEF2;--bd:#DFE2E8;--tx:#14171C;--mu:#525B68;--fa:#7A8390;--blue:#1D5FD6;--yel:#8A5A00;--org:#B23C08;--grn:#13733F;--red:#C42B27;--blueBg:#E7EFFD;--yelBg:#FBF1D6;--orgBg:#FCE8DC;--grnBg:#E1F3E8;--grayBg:#ECEEF2}
.root{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.live{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.chip{flex:none;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--bd);background:var(--s1);color:var(--mu);font:500 13px Inter,sans-serif;cursor:pointer}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:56px;color:var(--mu);text-decoration:none;font-size:11px;font-weight:500}
.tab.on{color:var(--tx)}
.srow{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-top:1px solid var(--bd);color:var(--tx);text-decoration:none;min-height:44px}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden">
<header style="padding: 18px 18px 10px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center"><h1 style="margin: 0; font-size: 22px; font-weight: 700; flex: 1">Sessiyalar</h1><span class="pill" style="color: var(--grn); background: var(--grnBg)"><span class="dot live"></span>Jonli</span></div>
<div style="display: flex; gap: 8px; overflow-x: auto"><sc-for list="{{chips}}" as="c" hint-placeholder-count="5"><button class="chip {{c.on}}" type="button" onClick="{{c.pick}}">{{c.l}}</button></sc-for></div>
</header>
<div style="flex: 1; overflow-y: auto; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
<section style="background: var(--s1); border: 1px solid var(--bd); border-radius: 14px; overflow: hidden">
<div style="display: flex; align-items: center; gap: 8px; padding: 10px 14px"><b style="flex: 1">{{g.name}}</b><span class="mono" style="font-size: 12px; color: var(--mu)">{{g.meta}}</span></div>
<sc-for list="{{g.items}}" as="s" hint-placeholder-count="2">
<a class="srow" href="MobileSession.dc.html" style="opacity: {{s.op}}">
<div style="display: flex; align-items: center; gap: 8px"><span class="pill" style="color: {{s.c}}; background: {{s.bg}}"><span class="dot {{s.anim}}"></span>{{s.l}}</span><span class="mono" style="font-size: 12px; color: var(--mu); flex: 1">{{s.m}}</span><span class="mono" style="font-size: 12px; color: var(--mu)">{{s.t}}</span></div>
<span style="font-size: 13px; color: var(--mu); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.msg}}</span>
</a>
</sc-for>
</section>
</sc-for>
</div>
<nav style="display: flex; border-top: 1px solid var(--bd); background: var(--s1); padding-bottom: 14px">
<a class="tab" href="MobileHome.dc.html"><svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1"></rect><rect x="9" y="2" width="5" height="5" rx="1"></rect><rect x="2" y="9" width="5" height="5" rx="1"></rect><rect x="9" y="9" width="5" height="5" rx="1"></rect></svg>Umumiy</a>
<a class="tab on" href="MobileSessions.dc.html"><svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="1.5"></rect><path d="M5 7l2 1.5L5 10"></path></svg>Sessiyalar</a>
<a class="tab" href="MobileHome.dc.html"><svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 4.5A1.5 1.5 0 013.5 3H6l1.5 1.5h5A1.5 1.5 0 0114 6v5.5a1.5 1.5 0 01-1.5 1.5h-9A1.5 1.5 0 012 11.5z"></path></svg>Loyihalar</a>
<a class="tab" href="MobileHome.dc.html"><svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M3 13V8M6.5 13V4M10 13V7M13.5 13V2"></path></svg>Tokenlar</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { f: "all" }; }
  renderVals() {
    const theme = this.props.theme || "dark";
    const S = { w: ["Ishlamoqda", "var(--blue)", "var(--blueBg)", "live"], wt: ["Javob kutmoqda", "var(--yel)", "var(--yelBg)", ""], ap: ["Ruxsat kutmoqda", "var(--org)", "var(--orgBg)", ""], i: ["Bo'sh", "var(--mu)", "var(--grayBg)", ""], d: ["Tugatdi", "var(--grn)", "var(--grnBg)", ""], x: ["Aloqa yo'q ⚠", "var(--mu)", "var(--grayBg)", ""] };
    const data = [
      ["backend-services", [["ap", "srv-01", "1 daq", "Bash: docker compose … up -d --build"], ["i", "srv-03", "1 s", "—"]]],
      ["demo_flow_ai", [["ap", "mac-mini", "3 daq", "Edit: src/pipelines/sentinel/ndvi.py"]]],
      ["mobile-app", [["wt", "win-pc", "6 daq", "Qaysi branch'ga push qilay?"]]],
      ["commander", [["w", "mac-mini", "12 daq", "Taymer komponentini yozyapman"]]],
      ["acme_app_ai", [["w", "srv-01", "4 daq", "Testlar: 42/120"]]],
      ["web-app", [["d", "mac-mini", "22 daq", "Landing responsiv qilindi"], ["x", "srv-05", "3 s", "build tugadi"]]]
    ];
    const f = this.state.f;
    const groups = data.map(function (g) {
      const items = g[1].filter(function (s) { return f === "all" || (f === "need" ? (s[0] === "ap" || s[0] === "wt") : s[0] === f); })
        .map(function (s) { const d = S[s[0]]; return { l: d[0], c: d[1], bg: d[2], anim: d[3], m: s[1], t: s[2], msg: s[3], op: s[0] === "x" ? 0.55 : 1 }; });
      return { name: g[0], meta: g[1].length + " sessiya", items: items };
    }).filter(function (g) { return g.items.length > 0; });
    return {
      themeClass: "root t-" + theme,
      chips: [["all", "Hammasi · 10"], ["need", "Diqqat · 3"], ["w", "Ishlamoqda · 3"], ["d", "Tugatdi · 2"], ["i", "Bo'sh · 1"]].map((c) => ({ l: c[1], on: f === c[0] ? "on" : "", pick: () => this.setState({ f: c[0] }) })),
      groups: groups
    };
  }
}
</script>
</body>
</html>
