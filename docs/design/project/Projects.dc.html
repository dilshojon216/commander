<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Commander · Loyihalar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.t-dark{--bg:#0B0D10;--s1:#12151A;--s2:#181C22;--s3:#20252D;--bd:#262C35;--tx:#E6E8EB;--mu:#9AA3B0;--fa:#6E7684;--blue:#5B9BFF;--yel:#E8BE54;--org:#FF8A4C;--grn:#4CC38A;--red:#FF6B66;--blueBg:rgba(91,155,255,.13);--grnBg:rgba(76,195,138,.13);--grayBg:rgba(154,163,176,.12)}
.t-light{--bg:#F4F5F7;--s1:#FFFFFF;--s2:#F7F8FA;--s3:#ECEEF2;--bd:#DFE2E8;--tx:#14171C;--mu:#525B68;--fa:#7A8390;--blue:#1D5FD6;--yel:#8A5A00;--org:#B23C08;--grn:#13733F;--red:#C42B27;--blueBg:#E7EFFD;--grnBg:#E1F3E8;--grayBg:#ECEEF2}
.root{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:10px}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.live{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.nav{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:7px;color:var(--mu);text-decoration:none;font-weight:500}
.nav:hover{background:var(--s2);color:var(--tx);text-decoration:none}
.nav.on{background:var(--s3);color:var(--tx)}
table{border-collapse:collapse;width:100%}
th{padding:0;border-bottom:1px solid var(--bd);text-align:left}
th button{display:flex;align-items:center;gap:4px;width:100%;padding:10px 14px;border:0;background:transparent;font:600 11px Inter,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--mu);cursor:pointer;white-space:nowrap}
th button.on{color:var(--tx)}
th.r button{justify-content:flex-end}
td{padding:0;border-bottom:1px solid var(--bd)}
td a.cell{display:block;padding:11px 14px;color:var(--tx);text-decoration:none;white-space:nowrap}
td.r a.cell{text-align:right}
tr:hover td{background:var(--s2)}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div class="{{themeClass}}" style="min-height: 100vh; display: flex; flex-wrap: wrap; align-items: stretch">
<aside style="flex: 1 1 220px; max-width: 240px; box-sizing: border-box; padding: 16px 12px; border-right: 1px solid var(--bd); background: var(--s1); display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px">
<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" fill="#FF7A45"></rect><path d="M8 9l4 4-4 4M14 17h5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span style="font-weight: 700; font-size: 15px">Commander</span>
</div>
<a class="nav" href="Main.dc.html"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1"></rect><rect x="9" y="2" width="5" height="5" rx="1"></rect><rect x="2" y="9" width="5" height="5" rx="1"></rect><rect x="9" y="9" width="5" height="5" rx="1"></rect></svg><span style="flex: 1">Umumiy</span></a>
<a class="nav" href="Sessions.dc.html"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="1.5"></rect><path d="M5 7l2 1.5L5 10"></path></svg><span style="flex: 1">Sessiyalar</span><span class="pill" style="height: 18px; padding: 0 6px; background: var(--org); color: #fff; font-size: 11px">2</span><span class="mono" style="font-size: 12px; color: var(--mu)">10</span></a>
<a class="nav on" href="Projects.dc.html"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 4.5A1.5 1.5 0 013.5 3H6l1.5 1.5h5A1.5 1.5 0 0114 6v5.5a1.5 1.5 0 01-1.5 1.5h-9A1.5 1.5 0 012 11.5z"></path></svg><span style="flex: 1">Loyihalar</span><span class="mono" style="font-size: 12px; color: var(--mu)">14</span></a>
<a class="nav" href="Tokens.dc.html"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 13V8M6.5 13V4M10 13V7M13.5 13V2"></path></svg><span style="flex: 1">Tokenlar</span></a>
<a class="nav" href="Machines.dc.html"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="2.5" width="12" height="4.5" rx="1"></rect><rect x="2" y="9" width="12" height="4.5" rx="1"></rect><path d="M4.5 4.75h.01M4.5 11.25h.01"></path></svg><span style="flex: 1">Mashinalar</span><span class="mono" style="font-size: 12px; color: var(--mu)">6/7</span></a>
<div style="flex: 1"></div>
<button class="nav" type="button" onClick="{{toggleTheme}}" style="border: 0; background: transparent; font: inherit; cursor: pointer; width: 100%"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M13 9.5A5.5 5.5 0 016.5 3a5.5 5.5 0 106.5 6.5z"></path></svg><span>{{themeLabel}}</span></button>
</aside>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--bd)">
<h1 style="margin: 0; font-size: 18px; font-weight: 600; flex: 1 1 auto">Loyihalar <span style="color: var(--mu); font-weight: 400; font-size: 14px">14 ta · 7 mashinada</span></h1>
<label style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border: 1px solid var(--bd); border-radius: 7px; background: var(--s1); color: var(--mu); width: 240px">
<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5L14 14"></path></svg>
<input type="search" aria-label="Loyiha qidirish" placeholder="Loyiha qidirish" style="flex: 1; min-width: 0; border: 0; background: transparent; color: var(--tx); font: inherit; outline: none">
</label>
<span class="pill" style="color: var(--grn); background: var(--grnBg)"><span class="dot live"></span>Jonli</span>
</header>
<div style="padding: 20px 24px">
<div class="card" style="overflow-x: auto">
<table>
<thead><tr>
<sc-for list="{{cols}}" as="c" hint-placeholder-count="7"><th class="{{c.cls}}"><button class="{{c.on}}" type="button" onClick="{{c.pick}}">{{c.label}} <span aria-hidden="true">{{c.arrow}}</span></button></th></sc-for>
</tr></thead>
<tbody>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="12">
<tr>
<td><a class="cell" href="ProjectDetail.dc.html"><span style="font-weight: 600">{{r.name}}</span> <span class="pill mono" style="height: 18px; font-size: 10px; margin-left: 6px; background: var(--s3); color: var(--mu)">{{r.kind}}</span></a></td>
<td><a class="cell mono" href="ProjectDetail.dc.html" style="color: var(--mu)">{{r.machine}}</a></td>
<td class="r"><a class="cell mono" href="ProjectDetail.dc.html">{{r.todayS}}</a></td>
<td class="r"><a class="cell mono" href="ProjectDetail.dc.html" style="color: var(--mu)">{{r.allS}}</a></td>
<td class="r"><a class="cell mono" href="ProjectDetail.dc.html" style="color: var(--mu)">{{r.req}}</a></td>
<td class="r"><a class="cell" href="ProjectDetail.dc.html"><span class="pill" style="height: 20px; color: {{r.oc}}; background: {{r.obg}}">{{r.open}}</span></a></td>
<td class="r"><a class="cell mono" href="ProjectDetail.dc.html" style="color: var(--mu)">{{r.last}}</a></td>
</tr>
</sc-for>
</tbody>
</table>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { theme: null, sort: "today", dir: -1 }; }
  renderVals() {
    const theme = this.state.theme || this.props.theme || "dark";
    const data = [
      ["commander", "git", "mac-mini", 24.8, 412, 61, 1, 0.1, "hozir"],
      ["demo_flow_ai", "git", "mac-mini", 15.2, 988, 38, 1, 0.2, "3 daq"],
      ["backend-services", "git", "srv-01", 11.9, 1420, 31, 2, 0.3, "1 daq"],
      ["acme_app_ai", "git", "srv-01", 8.4, 640, 22, 1, 0.4, "4 daq"],
      ["mobile-app", "git", "win-pc", 4.1, 301, 12, 1, 0.5, "6 daq"],
      ["smart_well", "git", "srv-02", 2.1, 220, 6, 1, 0.6, "38 daq"],
      ["web-app", "git", "mac-mini", 1.1, 188, 4, 1, 0.7, "22 daq"],
      ["reservoir_iq", "git", "srv-03", 0, 96, 0, 0, 2, "kecha"],
      ["herdos-fw", "git", "mac-mini", 0, 74, 0, 0, 3, "3 kun"],
      ["gateiq", "git", "srv-04", 0, 61, 0, 0, 4, "4 kun"],
      ["brain", "dir", "mac-mini", 0, 33, 0, 0, 5, "5 kun"],
      ["tender-bot", "git", "srv-03", 0, 12, 0, 0, 9, "9 kun"]
    ];
    const keys = { name: 0, machine: 2, today: 3, all: 4, req: 5, open: 6, last: 7 };
    const k = keys[this.state.sort], d = this.state.dir;
    const sorted = data.slice().sort(function (a, b) { return (a[k] > b[k] ? 1 : a[k] < b[k] ? -1 : 0) * d; });
    const fmt = function (m) { return m === 0 ? "—" : m >= 1000 ? (m / 1000).toFixed(2) + "B" : m.toFixed(1) + "M"; };
    const cols = [["name", "Loyiha", ""], ["machine", "Mashina", ""], ["today", "Bugun", "r"], ["all", "Jami", "r"], ["req", "So'rov (bugun)", "r"], ["open", "Ochiq sessiya", "r"], ["last", "Oxirgi", "r"]]
      .map((c) => ({ label: c[1], cls: c[2], on: this.state.sort === c[0] ? "on" : "", arrow: this.state.sort === c[0] ? (d < 0 ? "↓" : "↑") : "", pick: () => this.setState({ sort: c[0], dir: this.state.sort === c[0] ? -d : -1 }) }));
    return {
      themeClass: "root t-" + theme,
      themeLabel: theme === "dark" ? "Yorug' rejim" : "Qorong'i rejim",
      toggleTheme: () => this.setState({ theme: theme === "dark" ? "light" : "dark" }),
      cols: cols,
      rows: sorted.map(function (r) { return { name: r[0], kind: r[1], machine: r[2], todayS: fmt(r[3]), allS: fmt(r[4]), req: r[5] || "—", open: r[6], oc: r[6] ? "var(--blue)" : "var(--mu)", obg: r[6] ? "var(--blueBg)" : "transparent", last: r[8] }; })
    };
  }
}
</script>
</body>
</html>
